name: sport
description: "Sport"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.3
  get: ^4.6.6
  http: ^1.2.1
  spacer: ^1.0.0
  drop_down_search_field: ^1.0.4
  mask_text_input_formatter: ^2.9.0
  extended_masked_text: ^3.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  supabase_flutter: ^2.5.6
  flex_color_picker: ^3.5.1
  toastification: ^3.0.3
  responsive_ui: ^3.0.1
  google_fonts: ^6.3.3
  image_picker: ^1.1.2
  hugeicons: ^1.1.5
  cupertino_icons: ^1.0.8
  widgets_to_image:
  image_downloader_web:
  file_picker: ^10.1.9
  crop_your_image: ^2.0.0
  screenshot: ^3.0.0
  syncfusion_flutter_calendar: ^32.2.4
  syncfusion_flutter_charts: ^32.2.4
  syncfusion_flutter_core: ^32.2.4
  syncfusion_flutter_datepicker: ^32.2.4
  forui: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icons_launcher: ^3.0.0

icons_launcher:
  image_path: "assets/icon/icon.png"
  platforms:
    windows:
      enable: true
    android:
      enable: true
    ios:
      enable: true
    web:
      enable: true
      image_path: "assets/icon/icon.png"
      favicon_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/images/sport.png
